<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#3662ae">

  <title>Evolution | 굿즈리스트</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <style>
    /* ====================
       폰트
    ==================== */
    @font-face {
      font-family: "GmarketSans";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff")
        format("woff");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "GmarketSans";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff")
        format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ====================
       공통 설정
    ==================== */
    :root {
      --accent-color: #3662ae;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fafafa;
      color: #333;
      font-family: "GmarketSans", "맑은 고딕", sans-serif;
      font-weight: 500;
    }

    main {
      display: flex;
      flex-direction: column;
      max-width: 1000px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 32px 24px;
      padding-bottom: calc(
        32px + env(safe-area-inset-bottom, 0px)
      );
    }

    /* 화면 읽기 프로그램용 제목 */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* 리스트로 돌아가기 */
    .back-link {
      align-self: flex-start;
      margin-bottom: 24px;
      color: var(--accent-color);
      font-size: 12px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* ====================
       이미지·정보 좌우 배치
    ==================== */
    .album-header,
    .product-header {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
    }

    .album-header {
      gap: 20px;
    }

    .product-header {
      gap: 16px;
    }

    .album-info,
    .product-description {
      min-width: 0;
    }

    /* 앨범·상품 이미지 공통 */
    .album-image,
    .product-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: #f2f2f2;
      object-fit: cover;
      object-position: center;
    }

    /* ====================
       정보 표 공통
    ==================== */
    .info-table,
    .product-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      line-height: 1.6;
    }

    .info-table th,
    .info-table td,
    .product-table th,
    .product-table td {
      overflow-wrap: anywhere;
      text-align: center;
    }

    /* 왼쪽 항목 */
    .info-table th,
    .product-table th {
      border: 0;
      background: var(--accent-color);
      color: #fff;
      font-weight: 500;
    }

    /* 오른쪽 내용 */
    .info-table td,
    .product-table td {
      border: 1px solid var(--accent-color);
      background: #fff;
      color: #000;
    }

    /* 행 사이 테두리 겹침 방지 */
    .info-table tr + tr td,
    .product-table tr + tr td {
      border-top: 0;
    }

    /* 활동 정보 표 */
    .info-table {
      font-size: 14px;
    }

    .info-table th,
    .info-table td {
      padding: 14px 10px;
    }

    .info-table th {
      width: 36%;
    }

    /* 상품 정보 표 */
    .product-table {
      margin-top: 20px;
      font-size: 13px;
    }

    .product-table th,
    .product-table td {
      padding: 12px 10px;
    }

    .product-table th {
      width: 30%;
    }

    /* ====================
       굿즈 목록
    ==================== */
    .goods-section {
      margin-top: 32px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
    }

    .goods-list {
      display: grid;
      gap: 12px;
    }

    /* 상품 카드 */
    .goods-accordion {
      overflow: hidden;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #000;
    }

    .goods-summary {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 12px;
      min-height: 72px;
      padding: 8px 12px 8px 0;
    }

    /* 기본 펼치기 표시 제거 */
    .goods-summary,
    .photocard-toggle {
      list-style: none;
      cursor: pointer;
    }

    .goods-summary::-webkit-details-marker,
    .photocard-toggle::-webkit-details-marker {
      display: none;
    }

    .goods-number {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      border-right: 1px solid #ddd;
      font-size: 16px;
    }

    .goods-name {
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    /* 상품 카드 화살표 */
    .accordion-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
    }

    .accordion-arrow::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid var(--accent-color);
    }

    .goods-accordion[open] > .goods-summary
    .accordion-arrow::before {
      border-top: 0;
      border-bottom: 10px solid var(--accent-color);
    }

    /* 제목 아래 구분선 */
    .goods-divider {
      margin: 0 12px;
      border: 0;
      border-top: 1px solid #ddd;
    }

    /* 펼쳐지는 내용 */
    .goods-content {
      padding: 16px;
      font-size: 13px;
      line-height: 1.7;
    }

    /* ====================
       제품명·설명
    ==================== */
    .product-description {
      overflow-wrap: anywhere;
    }

    .product-name {
      margin: 0 0 8px;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.6;
    }

    .product-subtext {
      margin: 0;
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ====================
       포토카드 펼치기
    ==================== */
    .photocard-section {
      margin-top: 20px;
    }

    .photocard-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 12px 16px;
      border: 0;
      background: var(--accent-color);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.6;
    }

    /* 접힌 상태: 흰색 ▼ */
    .photocard-arrow {
      flex-shrink: 0;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 9px solid #fff;
    }

    /* 펼친 상태: 흰색 ▲ */
    .photocard-section[open] > .photocard-toggle
    .photocard-arrow {
      border-top: 0;
      border-bottom: 9px solid #fff;
    }

    /* 포토카드 중앙 배치 */
    .photocard-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
    }

    /* 원본 비율 유지 */
    .photocard-image {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 70vh;
      border-radius: 8px;
      object-fit: contain;
    }

    /* ====================
       제작자 표기
    ==================== */
    .site-credit {
      margin-top: auto;
      padding-top: 40px;
      color: #555;
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
    }

    .credit-divider {
      width: 140px;
      margin: 10px 0;
      border: 0;
      border-top: 1px dashed #999;
    }

    /* 키보드 선택 표시 */
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 3px;
    }

    /* ====================
       모바일
    ==================== */
    @media (max-width: 480px) {
      .album-header {
        gap: 12px;
      }

      .info-table {
        font-size: 11px;
      }

      .info-table th,
      .info-table td {
        padding: 10px 4px;
      }

      .info-table th {
        width: 40%;
      }
    }
/* 로고·사이트명 */
.site-brand {
  display: flex;
  align-items: center;
  align-self: flex-start;
  gap: 12px;
  margin-bottom: 24px;
  color: #333;
  text-decoration: none;
}

.site-logo {
  display: block;
  flex-shrink: 0;
  width: auto;
  height: 40px;
}

.site-brand-text {
  font-size: 25px;
  font-weight: 700;
  line-height: 1;
}
  </style>
</head>

<body>
  <main>
    <!-- 리스트로 돌아가기 -->
    <a class="back-link" href="./index.html#list">
      ← 리스트로 돌아가기
    </a>


    <!-- ========== 활동 정보 시작 ========== -->
    <section
      class="album-header"
      aria-labelledby="activity-title"
      data-category="앨범"
    >
      <!-- 왼쪽: 앨범 이미지 -->
      <img
        class="album-image"
        src="./01-Evolution.png"
        alt="Evolution 앨범"
      >

      <!-- 오른쪽: 활동 정보 -->
      <div class="album-info">
        <h1 id="activity-title" class="visually-hidden">
          Evolution
        </h1>

        <table class="info-table">
          <tbody>
            <tr>
              <th scope="row">활동명</th>
              <td>Evolution</td>
            </tr>

            <tr>
              <th scope="row">발매일</th>
              <td>2000.00.00</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <!-- ========== 활동 정보 끝 ========== -->


    <!-- ========== 굿즈 목록 시작 ========== -->
    <section class="goods-section" aria-labelledby="goods-title">
      <h2 id="goods-title" class="section-title">
        굿즈 보기
      </h2>

      <div class="goods-list">

        <!-- ========== 1번 상품 시작 ========== -->
        <!-- 분류 정보: 화면에는 표시되지 않음 -->
        <details class="goods-accordion" data-category="앨범">

          <!-- ---------- 상품 제목 시작 ---------- -->
          <summary class="goods-summary">
            <span class="goods-number">1</span>
            <span class="goods-name">1번 상품</span>

            <span
              class="accordion-arrow"
              aria-hidden="true"
            ></span>
          </summary>
          <!-- ---------- 상품 제목 끝 ---------- -->

          <hr class="goods-divider">

          <!-- ---------- 상품 상세 정보 시작 ---------- -->
          <div class="goods-content">

            <!-- ===== 이미지·제품명 시작 ===== -->
            <div class="product-header">

              <!-- 왼쪽: 상품 이미지 -->
              <img
                class="product-image"
                src="./Evolution-product-01.png"
                alt="Evolution 1번 상품"
                loading="lazy"
              >

              <!-- 오른쪽: 제품명·설명 -->
              <div class="product-description">
                <h3 class="product-name">제품명</h3>

                <p class="product-subtext">
                  ~~~
                </p>
              </div>

            </div>
            <!-- ===== 이미지·제품명 끝 ===== -->


            <!-- ===== 원가·구성품·비고 시작 ===== -->
            <table class="product-table">
              <tbody>
                <!-- 원가 -->
                <tr>
                  <th scope="row">원가</th>
                  <td>00,000원</td>
                </tr>

                <!-- 구성품 -->
                <tr>
                  <th scope="row">구성품</th>
                  <td>00, 00, 00, 00</td>
                </tr>

                <!-- 비고 -->
                <tr>
                  <th scope="row">비고</th>
                  <td>-</td>
                </tr>
              </tbody>
            </table>
            <!-- ===== 원가·구성품·비고 끝 ===== -->


            <!-- ===== 포토카드 시작: 없으면 이 영역 전체 삭제 ===== -->
            <details class="photocard-section">
              <summary class="photocard-toggle">
                <span>포토카드 보기</span>

                <span
                  class="photocard-arrow"
                  aria-hidden="true"
                ></span>
              </summary>

              <div class="photocard-content">

                <!-- 포토카드 이미지 1 -->
                <img
                  class="photocard-image"
                  src="./Evolution-photocard-01.png"
                  alt="Evolution 1번 상품 포토카드"
                  loading="lazy"
                >

                <!--
                  사진 추가:
                  위 img 태그 전체를 복사하고
                  src와 alt를 변경해 주세요.
                -->

              </div>
            </details>
            <!-- ===== 포토카드 끝 ===== -->

          </div>
          <!-- ---------- 상품 상세 정보 끝 ---------- -->

        </details>
        <!-- ========== 1번 상품 끝 ========== -->


        <!--
          2번 상품 추가 위치

          '1번 상품 시작'부터 '1번 상품 끝'까지 복사한 뒤
          여기에 붙여 넣어 주세요.

          수정할 내용:
          - 상품 연번
          - 상품 제목
          - data-category
          - 제품명과 설명
          - 사진 파일명과 alt
          - 원가·구성품·비고
          - 포토카드 유무와 사진
        -->

      </div>
    </section>
    <!-- ========== 굿즈 목록 끝 ========== -->


    <!-- ========== 제작자 표기 시작 ========== -->
    <footer class="site-credit">
      제작<br>

      <a
        href="https://x.com/ing_ddo_11"
        target="_blank"
        rel="noopener noreferrer"
      >@ing_ddo_11</a>

      <hr class="credit-divider">

      도움<br>

      <a
        href="https://x.com/hhhh_7989"
        target="_blank"
        rel="noopener noreferrer"
      >@hhhh_7989</a><br>

      <a
        href="https://x.com/UrimThummim0505"
        target="_blank"
        rel="noopener noreferrer"
      >@UrimThummim0505</a><br>

      <a
        href="https://x.com/forkkeu"
        target="_blank"
        rel="noopener noreferrer"
      >@forkkeu</a>
    </footer>
    <!-- ========== 제작자 표기 끝 ========== -->

  </main>
<!-- 로고·사이트명: 누르면 메인으로 이동 -->
<a class="site-brand" href="./index.html">
  <img
    class="site-logo"
    src="./logo.png"
    alt="FS LIST"
  >
  <span class="site-brand-text">굿즈리스트</span>

</body>
