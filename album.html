<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#3662ae">

  <title>앨범 | 굿즈리스트</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <style>
    /* ====================
       폰트
    ==================== */
    @font-face {
      font-family: "GmarketSans";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff")
        format("woff");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "GmarketSans";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff")
        format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ====================
       공통 설정
    ==================== */
    :root {
      --accent-color: #3662ae;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: #fafafa;
      color: #333;
      font-family: "GmarketSans", "맑은 고딕", sans-serif;
      font-weight: 500;
    }

    main {
      display: flex;
      flex-direction: column;
      max-width: 1000px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 32px 24px;
      padding-bottom: calc(
        32px + env(safe-area-inset-bottom, 0px)
      );
    }

    /* ====================
       로고·사이트명
    ==================== */
    .site-brand {
      display: flex;
      align-items: center;
      align-self: flex-start;
      gap: 12px;
      margin-bottom: 24px;
      color: #333;
      text-decoration: none;
    }

    .site-logo {
      display: block;
      flex-shrink: 0;
      width: auto;
      height: 40px;
    }

    .site-brand-text {
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
    }

    /* ====================
       카테고리 제목·설명
    ==================== */
    .category-title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
    }

    .category-description {
      margin: 10px 0 16px;
      color: #555;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--accent-color);
      font-size: 12px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* ====================
       앨범 상품 목록
    ==================== */
    .album-products {
      display: grid;
      gap: 12px;
    }

    /* ====================
       상품 펼치기 상자
    ==================== */
    .goods-accordion {
      overflow: hidden;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #000;
    }

    .goods-summary {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 48px;
      align-items: center;
      gap: 12px;
      min-height: 72px;
      padding: 8px 12px 8px 0;
      list-style: none;
      cursor: pointer;
    }

    .goods-summary::-webkit-details-marker {
      display: none;
    }

    .goods-number {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      margin: 0;
      padding: 0;
      border-right: 1px solid #ddd;
      font-size: 16px;
    }

    .goods-name {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    /* 펼치기 화살표 */
    .accordion-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
    }

    .accordion-arrow::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid var(--accent-color);
    }

    .goods-accordion[open] > .goods-summary .accordion-arrow::before {
      border-top: 0;
      border-bottom: 10px solid var(--accent-color);
    }

    /* 제목 아래 구분선 */
    .goods-divider,
    .goods-title-divider {
      margin: 0 12px;
      border: 0;
      border-top: 1px solid #ddd;
    }

    /* ====================
       펼쳐지는 상품 내용
    ==================== */
    .goods-content {
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
    }

    .product-header {
      display: grid;
      grid-template-columns: minmax(0, 220px) minmax(0, 1fr);
      align-items: center;
      gap: 20px;
    }

    .product-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      background: #f2f2f2;
      object-fit: cover;
      object-position: center;
    }

    .product-description {
      min-width: 0;
    }

    .product-name {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .product-subtext {
      margin: 0;
      color: #555;
      font-size: 13px;
      line-height: 1.6;
    }

    /* ====================
       원가·구성품·비고 표
    ==================== */
    .product-table {
      width: 100%;
      margin-top: 20px;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 12px;
      table-layout: fixed;
      font-size: 13px;
    }

    .product-table th,
    .product-table td {
      padding: 12px 10px;
      text-align: center;
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    .product-table th {
      width: 30%;
      border: 0;
      background: var(--accent-color);
      color: #fff;
      font-weight: 500;
    }

    .product-table td {
      border: 1px solid var(--accent-color);
      background: #fff;
      color: #000;
    }

    /* 왼쪽 항목 사이 흰색 구분선 */
    .product-table tr + tr th {
      border-top: 1px solid #fff;
    }

    /* 오른쪽 테두리 겹침 방지 */
    .product-table tr + tr td {
      border-top: 0;
    }

    .product-table tr:first-child th {
      border-top-left-radius: 12px;
    }

    .product-table tr:first-child td {
      border-top-right-radius: 12px;
    }

    .product-table tr:last-child th {
      border-bottom-left-radius: 12px;
    }

    .product-table tr:last-child td {
      border-bottom-right-radius: 12px;
    }

    /* ====================
       포토카드 펼치기
    ==================== */
    .photocard-section {
      overflow: hidden;
      margin-top: 20px;
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      background: #fff;
    }

    .photocard-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
      padding: 12px 16px;
      border: 0;
      background: var(--accent-color);
      color: #fff;
      font-size: 13px;
      list-style: none;
      cursor: pointer;
    }

    .photocard-toggle::-webkit-details-marker {
      display: none;
    }

    .photocard-arrow {
      width: 0;
      height: 0;
      flex-shrink: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 9px solid #fff;
    }

    .photocard-section[open] > .photocard-toggle .photocard-arrow {
      border-top: 0;
      border-bottom: 9px solid #fff;
    }

    .photocard-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      padding: 0;
    }

    .photocard-image {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border: 0;
      border-radius: 0;
    }

    /* ====================
       제작자·도움
    ==================== */
    .site-credit {
      margin-top: auto;
      padding-top: 40px;
      color: #555;
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
    }

    .credit-divider {
      width: 140px;
      margin: 10px 0;
      border: 0;
      border-top: 1px dashed #999;
    }

    /* 링크 색깔과 연결은 유지하고 밑줄만 제거 */
    .site-credit a,
    .site-credit a:hover,
    .site-credit a:focus,
    .site-credit a:active {
      text-decoration: none;
    }

    /* ====================
       키보드 선택 표시
    ==================== */
    a:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 3px;
    }

    .goods-summary:focus-visible,
    .photocard-toggle:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: -3px;
    }

    /* ====================
       작은 화면
    ==================== */
    @media (max-width: 480px) {
      .product-header {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
    }
  </style>
</head>

<body>
  <main>
    <!-- ========== 로고·사이트명 시작 ========== -->
<a class="site-brand" href="./index.html#home">
      <img
        class="site-logo"
        src="https://drive.google.com/thumbnail?id=1-pbgQfZiJJAgWXwyRTvR9-FxeN2V2PbB&amp;sz=w1600"
        alt="FS LIST"
      >
      <span class="site-brand-text">굿즈리스트</span>
    </a>
    <!-- ========== 로고·사이트명 끝 ========== -->


    <!-- ========== 앨범 카테고리 시작 ========== -->
    <section aria-labelledby="album-title">
      <h1 id="album-title" class="category-title">
        카테고리 → 앨범
      </h1>

      <p class="category-description">
        음반, LP 등
      </p>

      <a class="back-link" href="./index.html#category">
        ← 카테고리로 이동하기
      </a>

      <!-- 앨범 상품 목록 시작 -->
      <p
        id="album-message"
        class="category-description"
        role="status"
      >
        앨범 상품을 불러오고 있어요.
      </p>

      <div id="album-products" class="album-products"></div>
      <!-- 앨범 상품 목록 끝 -->
    </section>
    <!-- ========== 앨범 카테고리 끝 ========== -->


    <!-- ========== 제작자 표기 시작 ========== -->
    <footer class="site-credit">
      제작<br>

      <a
        href="https://x.com/ing_ddo_11"
        target="_blank"
        rel="noopener noreferrer"
      >@ing_ddo_11</a>

      <hr class="credit-divider">

      도움<br>

      <a
        href="https://x.com/hhhh_7989"
        target="_blank"
        rel="noopener noreferrer"
      >@hhhh_7989</a><br>

      <a
        href="https://x.com/UrimThummim0505"
        target="_blank"
        rel="noopener noreferrer"
      >@UrimThummim0505</a><br>

      <a
        href="https://x.com/forkkeu"
        target="_blank"
        rel="noopener noreferrer"
      >@forkkeu</a>
    </footer>
    <!-- ========== 제작자 표기 끝 ========== -->
  </main>


  <script>
    (() => {
      /* ====================
         상품을 가져올 활동 페이지

         활동 페이지가 늘어나면
         이 목록에 추가하세요.
      ==================== */
      const activityPages = [
        { name: "Evolution", url: "./Evolution.html" }
      ];

      const container = document.getElementById("album-products");
      const message = document.getElementById("album-message");


      /* ====================
         앨범 상품 상자 가져오기
      ==================== */
      async function readAlbumProducts(activity, activityIndex) {
        const pageUrl = new URL(activity.url, location.href);

        const response = await fetch(pageUrl.href, {
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(
            `${activity.name} 페이지를 불러오지 못했습니다.`
          );
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(
          html,
          "text/html"
        );

        const products = doc.querySelectorAll(
          ".goods-accordion[data-category]"
        );

        return [...products]
          .filter((product) => {
            return product.dataset.category.trim() === "앨범";
          })
          .map((product, productIndex) => {
            /* 상품 상자와 내부 내용 전체 복사 */
            const copy = document.importNode(product, true);

            /* 처음에는 상품과 포토카드 모두 접기 */
            copy.removeAttribute("open");

            copy.querySelectorAll("details").forEach((details) => {
              details.removeAttribute("open");
            });

            /*
              여러 활동에 같은 id가 있어도
              이 페이지에서는 겹치지 않도록 변경
            */
            const prefix =
              `album-${activityIndex}-${productIndex}-`;

            const idMap = new Map();

            [copy, ...copy.querySelectorAll("[id]")].forEach(
              (element) => {
                if (!element.id) return;

                const originalId = element.id;
                const newId = prefix + originalId;

                idMap.set(originalId, newId);
                element.id = newId;
              }
            );

            /* id를 참조하는 속성도 함께 변경 */
            [copy, ...copy.querySelectorAll("*")].forEach(
              (element) => {
                [
                  "aria-labelledby",
                  "aria-describedby",
                  "aria-controls",
                  "for"
                ].forEach((attribute) => {
                  const value = element.getAttribute(attribute);

                  if (!value) return;

                  const updatedValue = value
                    .split(/\s+/)
                    .map((id) => idMap.get(id) || id)
                    .join(" ");

                  element.setAttribute(attribute, updatedValue);
                });
              }
            );

            /* 이미지 주소를 원본 활동 페이지 기준으로 연결 */
            copy.querySelectorAll("img[src]").forEach((image) => {
              const src = image.getAttribute("src")?.trim();

              if (src) {
                image.src = new URL(src, pageUrl.href).href;
              }
            });

            /* 상품 내부 링크 주소도 원본 페이지 기준으로 연결 */
            copy.querySelectorAll("a[href]").forEach((link) => {
              const href = link.getAttribute("href")?.trim();

              if (!href) return;

              if (
                href.startsWith("#") &&
                idMap.has(href.slice(1))
              ) {
                link.setAttribute(
                  "href",
                  `#${idMap.get(href.slice(1))}`
                );
              } else {
                link.href = new URL(href, pageUrl.href).href;
              }
            });

            return copy;
          });
      }


      /* ====================
         앨범 상품 목록 표시
      ==================== */
      async function loadAlbums() {
        const responses = await Promise.allSettled(
          activityPages.map((activity, index) => {
            return readAlbumProducts(activity, index);
          })
        );

        const products = [];
        let failedCount = 0;

        responses.forEach((response) => {
          if (response.status === "fulfilled") {
            products.push(...response.value);
          } else {
            failedCount += 1;
          }
        });

        container.replaceChildren();

        const fragment = document.createDocumentFragment();

        products.forEach((product, index) => {
          /* 앨범 페이지의 표시 순서대로 번호 부여 */
          const number = product.querySelector(
            ".goods-summary > .goods-number"
          );

          if (number) {
            number.textContent = index + 1;
          }

          fragment.append(product);
        });

        container.append(fragment);
        message.hidden = false;

        if (failedCount === activityPages.length) {
          message.textContent =
            "상품 정보를 불러오지 못했어요. 잠시 후 새로고침해 주세요.";
          return;
        }

        if (products.length === 0) {
          message.textContent = failedCount > 0
            ? "일부 활동 페이지를 불러오지 못했어요. 불러온 페이지에는 앨범 상품이 없어요."
            : "아직 등록된 앨범 상품이 없어요.";
          return;
        }

        if (failedCount > 0) {
          message.textContent =
            "일부 활동 페이지를 불러오지 못해 상품이 누락될 수 있어요.";
        } else {
          message.textContent = "";
          message.hidden = true;
        }
      }

      loadAlbums();
    })();
  </script>
</body>
</html>
