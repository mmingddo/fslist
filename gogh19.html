<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./category.css">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#3662ae">

  <title>2019 빈센트 반 고흐 | 굿즈리스트</title>

  <!-- 앱 설정·아이콘 -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <!-- 공통 디자인 -->
  <link rel="stylesheet" href="./category.css">

  <!-- 상품별 북마크·메모 -->
  <script src="./personal.js" defer></script>

  <style>
    /* ====================
       활동 상세페이지 전용 디자인
    ==================== */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .back-link {
      align-self: flex-start;
    }

    /* ====================
       활동 이미지·정보
    ==================== */
    .album-header {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 20px;
    }

    .album-info {
      min-width: 0;
    }

    .album-image {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      background: #f2f2f2;
      object-fit: cover;
      object-position: center;
    }

    /* ====================
       활동 정보 표
    ==================== */
    .info-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 12px;
      table-layout: fixed;
      font-size: 14px;
      line-height: 1.6;
    }

    .info-table th,
    .info-table td {
      padding: 14px 10px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .info-table th {
      width: 36%;
      border: 0;
      background: var(--accent-color);
      color: #fff;
      font-weight: 500;
    }

    .info-table td {
      border: 1px solid var(--accent-color);
      background: #fff;
      color: #000;
    }

    /* 왼쪽 항목 사이 흰색 구분선 */
    .info-table tr + tr th {
      border-top: 1px solid #fff;
    }

    /* 오른쪽 테두리 겹침 방지 */
    .info-table tr + tr td {
      border-top: 0;
    }

    /* 표 바깥 모서리 */
    .info-table tr:first-child th {
      border-top-left-radius: 12px;
    }

    .info-table tr:first-child td {
      border-top-right-radius: 12px;
    }

    .info-table tr:last-child th {
      border-bottom-left-radius: 12px;
    }

    .info-table tr:last-child td {
      border-bottom-right-radius: 12px;
    }

    /* ====================
       굿즈 목록
    ==================== */
    .goods-section {
      margin-top: 32px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
    }

    .goods-list {
      display: grid;
      gap: 12px;
    }

    .goods-content {
      line-height: 1.7;
    }

    .product-image {
      height: auto;
    }

    .product-description {
      overflow-wrap: anywhere;
    }

    .product-table {
      line-height: 1.6;
    }

    /* ====================
       모바일
    ==================== */
    @media (max-width: 480px) {
      .album-header {
        gap: 12px;
      }

      .info-table {
        font-size: 11px;
      }

      .info-table th,
      .info-table td {
        padding: 10px 4px;
      }

      .info-table th {
        width: 40%;
      }
    }
  </style>
</head>

<body>
  <main>
    <!-- ========== 로고·사이트명 시작 ========== -->
    <a class="site-brand" href="./index.html#home">
      <img
        class="site-logo"
        src="https://drive.google.com/thumbnail?id=1-pbgQfZiJJAgWXwyRTvR9-FxeN2V2PbB&amp;sz=w1600"
        alt="FS LIST"
      >
      <span class="site-brand-text">굿즈리스트</span>
    </a>
    <!-- ========== 로고·사이트명 끝 ========== -->

    <a class="back-link" href="./index.html#list">
      ← 리스트로 돌아가기
    </a>

    <!-- ========== 활동 정보 시작 ========== -->
    <section
      class="album-header"
      aria-labelledby="activity-title"
    >
      <img
        class="album-image"
        src="https://drive.google.com/thumbnail?id=1cclCV87FWpDJEHbbp3n9HNh3IPDVIPm7&amp;sz=w1600"
        alt="2019 빈센트 반 고흐 활동"
      >

      <div class="album-info">
        <h1 id="activity-title" class="visually-hidden">
          2019 빈센트 반 고흐
        </h1>

        <table class="info-table">
          <tbody>
            <tr>
              <th scope="row">활동명</th>
              <td>2019<br>빈센트 반 고흐</td>
            </tr>

            <tr>
              <th scope="row">공연일</th>
              <td>
                2019.12.07<br>
                ~<br>
                2020.03.01
              </td>
            </tr>

            <tr>
              <th scope="row">역</th>
              <td>고흐</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    <!-- ========== 활동 정보 끝 ========== -->


    <!-- ========== 굿즈 목록 시작 ========== -->
    <section class="goods-section" aria-labelledby="goods-title">
      <h2 id="goods-title" class="section-title">
        굿즈 보기
      </h2>

      <div class="goods-list">

        <!-- ========== 1번 프로그램북 시작 ========== -->
        <details
          id="vincentvangogh-programbook"
          class="goods-accordion"
          data-category="MD, 개인"
          data-name="프로그램북"
          data-keywords="vincentvangogh, 빈센트반고흐, 뮤지컬, 프로그램북, 플북"
          data-members="두훈"
        >
          <summary class="goods-summary">
            <span class="goods-number">1</span>

            <span class="goods-name">
              2019 빈센트 반 고흐<br>
              프로그램북
            </span>

            <span
              class="accordion-arrow"
              aria-hidden="true"
            ></span>
          </summary>

          <hr class="goods-divider">

          <!-- 상품 상세 시작 -->
          <div class="goods-content">

            <!-- 이미지·설명·메모·북마크 -->
            <div class="product-header">
              <img
                class="product-image"
                src="https://drive.google.com/thumbnail?id=1nFiPCxGjiikpgtulreomtSatq-uT4GgJ&amp;sz=w1600"
                alt="2019 빈센트 반 고흐 MD 프로그램북"
                loading="lazy"
              >

              <!-- personal.js에서 버튼을 추가하는 자리 -->
              <div class="product-description"></div>
            </div>

            <!-- 원가·구성품·비고 -->
            <table class="product-table">
              <tbody>
                <tr>
                  <th scope="row">원가</th>
                  <td>10,000원</td>
                </tr>

                <tr>
                  <th scope="row">구성품</th>
                  <td>프로그램북</td>
                </tr>

                <tr>
                  <th scope="row">비고</th>
                  <td>-</td>
                </tr>
              </tbody>
            </table>

          </div>
          <!-- 상품 상세 끝 -->
        </details>
        <!-- ========== 1번 프로그램북 끝 ========== -->

      </div>
    </section>
    <!-- ========== 굿즈 목록 끝 ========== -->


    <!-- ========== 제작자 표기 시작 ========== -->
    <footer class="site-credit">

      <a
        href="https://x.com/ing_ddo_11"
        target="_blank"
        rel="noopener noreferrer"

      <hr class="credit-divider">

      도움<br>

      <a
        href="https://x.com/hhhh_7989"
        target="_blank"
        rel="noopener noreferrer"
      >@hhhh_7989</a><br>

      <a
        href="https://x.com/UrimThummim0505"
        target="_blank"
        rel="noopener noreferrer"
      >@UrimThummim0505</a><br>

      <a
        href="https://x.com/forkkeu"
        target="_blank"
        rel="noopener noreferrer"
      >@forkkeu</a>
    </footer>
    <!-- ========== 제작자 표기 끝 ========== -->
  </main>

  <script>
    (() => {
      /* ====================
         검색한 상품 펼치기
      ==================== */
      const cards = [
        ...document.querySelectorAll(
          ".goods-accordion[data-category]"
        )
      ];

      const productNumber = Number(
        new URLSearchParams(location.search).get("product")
      );

      let id = "";

      try {
        id = decodeURIComponent(location.hash.slice(1));
      } catch {
        // 잘못된 해시 형식이면 상품 번호로 확인
      }

      /* 고유 id로 상품 찾기 */
      let target = cards.find((card) => card.id === id);

      /* 상품 번호 링크도 지원 */
      if (
        !target &&
        Number.isInteger(productNumber) &&
        productNumber >= 1
      ) {
        target = cards[productNumber - 1];
      }

      if (!target) return;

      target.open = true;

      function scrollToProduct() {
        requestAnimationFrame(() => {
          target.scrollIntoView({
            block: "start"
          });
        });
      }

      if (document.readyState === "complete") {
        scrollToProduct();
      } else {
        window.addEventListener("load", scrollToProduct, {
          once: true
        });
      }
    })();
  </script>
</body>
</html>
