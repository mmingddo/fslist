<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSGOODSLIST</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #333;
      background: #fafafa;
      font-family: Arial, "맑은 고딕", sans-serif;
    }

    /* 하단 메뉴에 내용이 가리지 않도록 여백 확보 */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px;
      padding-bottom: calc(110px + env(safe-area-inset-bottom));
    }

    h1 {
      font-size: 26px;
    }

    .description {
      color: #888;
      line-height: 1.6;
    }

    [hidden] {
      display: none !important;
    }

    /* 검색 입력창 */
    .search-input {
      width: 100%;
      margin-top: 16px;
      padding: 15px 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      font: inherit;
    }

    /* 하단 고정 메뉴 */
    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 100;
      width: 100%;
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid #eee;
      background: #fff;
    }

    .menu-inner {
      display: flex;
      max-width: 600px;
      margin: 0 auto;
    }

    .menu-button {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 76px;
      padding: 12px 0;
      border: 0;
      background: transparent;
      color: #999;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .menu-button svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 선택된 메뉴 색상 */
    .menu-button[aria-current="page"] {
      color: #333;
      font-weight: bold;
    }

    .menu-button:focus-visible {
      outline: 2px solid #777;
      outline-offset: -5px;
      border-radius: 10px;
    }
    .site-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 24px;
    }

    .site-logo {
      display: block;
      width: 24px;
      max-width: 30%;
      height: auto;
     }

.title-text {
  font-size: 24px;
  font-weight: 700;
}
  </style>
</head>

<body>
  <main>
    <!-- 검색 화면 -->
    <section id="search" hidden>
      <h1>검색</h1>
      <label for="search-input">찾고 싶은 사진의 키워드</label>
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="날짜, 행사명 등을 입력하세요"
      >
      <p class="description">
        사진을 등록한 뒤 검색 기능을 연결할 예정이에요.
      </p>
    </section>

    <!-- 메인 화면 -->
    <section id="home">
    <h1 class="site-title">
      <img src="./logo.png" alt="FS LIST" class="site-logo">
      <span class="title-text">굿즈 리스트</span>
    </h1>
      <p class="description">사진으로 모아두는 소중한 순간들</p>
    </section>

    <!-- 카테고리 화면 -->
    <section id="category" hidden>
      <h1>카테고리</h1>
      <p class="description">
        사진을 분류할 카테고리가 여기에 표시돼요.
      </p>
    </section>
  </main>

  <!-- 하단 메뉴 -->
  <nav class="bottom-menu" aria-label="하단 메뉴">
    <div class="menu-inner">

      <button
        class="menu-button"
        type="button"
        data-page="search"
        aria-controls="search"
      >
        <!-- 돋보기 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
        <span>검색</span>
      </button>

      <button
        class="menu-button"
        type="button"
        data-page="home"
        aria-controls="home"
        aria-current="page"
      >
        <!-- 집 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10 12 3l9 7"></path>
          <path d="M5 9v12h5v-7h4v7h5V9"></path>
        </svg>
        <span>메인</span>
      </button>

      <button
        class="menu-button"
        type="button"
        data-page="category"
        aria-controls="category"
      >
        <!-- 가로줄 3개 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>카테고리</span>
      </button>

    </div>
  </nav>

  <script>
    const menuButtons = document.querySelectorAll(".menu-button");
    const pages = document.querySelectorAll("main > section");

    menuButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const selectedPage = button.dataset.page;

        pages.forEach((page) => {
          page.hidden = page.id !== selectedPage;
        });

        menuButtons.forEach((item) => {
          item.removeAttribute("aria-current");
        });

        button.setAttribute("aria-current", "page");
        window.scrollTo(0, 0);

        if (selectedPage === "search") {
          document.getElementById("search-input").focus();
        }
      });
    });
  </script>
</body>
</html>
