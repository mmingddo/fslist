<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#3662ae">

  <title>굿즈리스트</title>

  <!-- 설치 설정 및 브라우저 아이콘 -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <style>
    /* 폰트 */
    @font-face {
      font-family: "GmarketSans";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff")
        format("woff");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "GmarketSans";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff")
        format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* 공통 설정 */
    :root {
      --accent-color: #3662ae;
      --background-color: #fafafa;
      --small-text-size: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background-color);
      color: #333;
      font-family: "GmarketSans", "맑은 고딕", sans-serif;
      font-weight: 500;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    main {
      display: flex;
      flex-direction: column;
      max-width: 1000px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 40px 24px;
      padding-bottom: calc(
        110px + env(safe-area-inset-bottom, 0px)
      );
    }

    h1 {
      font-weight: 700;
    }

    .description {
      color: #888;
      line-height: 1.6;
    }

    /* 제목 배치 */
    .site-title,
    .page-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
    }

    .page-title {
      line-height: 1.3;
    }

    /* 메인 제목 */
    .site-logo {
      display: block;
      flex-shrink: 0;
      width: auto;
      height: 40px;
    }

    .title-text {
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
    }

    /* 검색 제목 */
    #search .page-title {
      margin-bottom: 10px;
      font-size: 26px;
    }

    /* 리스트 제목 */
    #list .page-title {
      font-size: 26px;
    }

    /* 카테고리 제목 */
    #category .page-title {
      font-size: 26px;
    }

    /* 제목·메뉴 아이콘 */
    .page-title svg,
    .menu-button svg {
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-title svg {
      width: 32px;
      height: 32px;
    }

    /* 검색창 */
    .search-input {
      width: 100%;
      margin-top: 6px;
      padding: 15px 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fff;
      color: #333;
    }

    /* 메인 상단 버튼 배치 */
    .home-links {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    /* 둥근 버튼 공통 설정 */
    .home-link,
    .category-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 44px;
      border: 1px solid #000;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      text-decoration: none;
    }

    .home-link {
      padding: 10px 6px;
    }

    /* 메인 구분선 */
    .home-divider {
      margin: 28px 0;
      border: 0;
      border-top: 1px solid #ddd;
    }

    /* 최근 굿즈 소식 제목 */
    .news-title {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
    }

    /* 최근 굿즈 소식 안내 */
    .news-description {
      margin: 0 0 16px;
      color: #555;
      font-size: var(--small-text-size);
      line-height: 1.6;
    }

    /* 굿즈 카드 목록 */
    .goods-news {
      display: grid;
      gap: 12px;
    }

    .goods-card {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 64px;
      align-items: center;
      gap: 12px;
      min-height: 80px;
      padding: 8px 12px 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #000;
      text-decoration: none;
    }

    /* 연번: 왼쪽 테두리와 세로선 사이 가운데 정렬 */
    .goods-number {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      margin: 0;
      padding: 0;
      border-right: 1px solid #ddd;
      font-size: 16px;
    }

    .goods-name {
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    /* 미리보기 자리 및 이미지 */
    .goods-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 4px;
      background: #f2f2f2;
      color: #777;
      font-size: 11px;
    }

    img.goods-preview {
      object-fit: contain;
    }

    .home-link[href],
    .goods-card[href] {
      cursor: pointer;
    }

    /* 카테고리 */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 24px;
    }

    .category-item {
      padding: 8px 4px;
      cursor: pointer;
    }

    .category-all {
      grid-column: 1 / -1;
    }

    /* 공통 제작자 표기 */
    .site-credit {
      margin-top: auto;
      padding-top: 32px;
      color: #555;
      font-size: var(--small-text-size);
      line-height: 1.6;
      text-align: right;
    }

    /* 하단 고정 메뉴 */
    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 100;
      width: 100%;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border-top: 1px solid #eee;
      background: #fff;
    }

    .menu-inner {
      display: flex;
      max-width: 600px;
      margin: 0 auto;
    }

    .menu-button {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      min-height: 76px;
      padding: 12px 0;
      border: 0;
      background: transparent;
      color: #999;
      font-size: var(--small-text-size);
      font-weight: 500;
      cursor: pointer;
    }

    .menu-button svg {
      width: 25px;
      height: 25px;
    }

    .menu-button span {
      position: relative;
      padding-bottom: 7px;
    }

    /* 선택된 메뉴 색상 */
    .menu-button[aria-current="page"] {
      color: var(--accent-color);
    }

    /* 선택된 메뉴 밑줄 */
    .menu-button[aria-current="page"] span::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      border-radius: 2px;
      background: var(--accent-color);
    }

    /* 키보드 선택 표시 */
    .home-link[href]:focus-visible,
    .goods-card[href]:focus-visible,
    .category-item:focus-visible,
    .search-input:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 3px;
    }

    .menu-button:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: -5px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <main>
 <!-- 메인 화면 -->
    <section id="home">
      <h1 class="site-title">
        <img
          class="site-logo"
          src="./logo.png"
          alt="FS LIST"
        >
        <span class="title-text">굿즈 리스트</span>
      </h1>

      <div class="home-links">
        <a class="home-link" href="./updates.html">
          업데이트 소식
        </a>

        <a class="home-link" href="./report.html">
          제보 / 오류 신고
        </a>
      </div>

      <hr class="home-divider">

      <h2 class="news-title">최근 발매된 굿즈 소식</h2>

      <p class="news-description">
        누르면 각 굿즈의 공지 페이지로 이동합니다.
        (X(구 트위터), 인스타그램 등)
      </p>

      <!--
        공지 주소가 정해지면 카드 시작 태그를 변경하세요.

        <a
          class="goods-card"
          href="실제 공지 주소"
          target="_blank"
          rel="noopener noreferrer"
        >

        사진을 넣으려면 미리보기 span을 아래처럼 교체하세요.

        <img
          class="goods-preview"
          src="./goods-01.jpg"
          alt="굿즈 미리보기"
          loading="lazy"
        >
      -->

      <div class="goods-news">
        <a class="goods-card">
          <span class="goods-number">1</span>
          <span class="goods-name">굿즈 이름 1</span>
          <span class="goods-preview">미리보기</span>
        </a>

        <a class="goods-card">
          <span class="goods-number">2</span>
          <span class="goods-name">굿즈 이름 2</span>
          <span class="goods-preview">미리보기</span>
        </a>

        <a class="goods-card">
          <span class="goods-number">3</span>
          <span class="goods-name">굿즈 이름 3</span>
          <span class="goods-preview">미리보기</span>
        </a>

        <a class="goods-card">
          <span class="goods-number">4</span>
          <span class="goods-name">굿즈 이름 4</span>
          <span class="goods-preview">미리보기</span>
        </a>

        <a class="goods-card">
          <span class="goods-number">5</span>
          <span class="goods-name">굿즈 이름 5</span>
          <span class="goods-preview">미리보기</span>
        </a>
      </div>
    </section>

    <!-- 검색 화면 -->
    <section id="search" hidden>
      <h1 class="page-title">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
        <span>검색</span>
      </h1>

      <input
        id="search-input"
        class="search-input"
        type="search"
        aria-label="사진 키워드 검색"
        placeholder="찾고싶은 사진의 키워드를 입력하세요"
      >

      <p class="description">
        사진을 등록한 뒤 검색 기능을 연결할 예정이에요.
      </p>
    </section>

    <!-- 리스트 화면 -->
    <section id="list" hidden>
      <h1 class="page-title">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="4"
            y="3"
            width="16"
            height="18"
            rx="2"
          ></rect>
          <path d="m8 12 3 3 5-6"></path>
        </svg>
        <span>리스트</span>
      </h1>
    </section>

    <!-- 카테고리 화면 -->
    <section id="category" hidden>
      <h1 class="page-title">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>카테고리</span>
      </h1>

      <div class="category-grid">
        <button
          class="category-item category-all"
          type="button"
        >
          포토카드만 보기
        </button>

        <button class="category-item" type="button">
          앨범
        </button>

        <button class="category-item" type="button">
          MD
        </button>

        <button class="category-item" type="button">
          시즌그리팅
        </button>

        <button class="category-item" type="button">
          팬키트
        </button>

        <button class="category-item" type="button">
          기타
        </button>

        <button class="category-item" type="button">
          개인
        </button>
      </div>
    </section>

    <!-- 공통 제작자 표기 -->
    <footer class="site-credit">
      제작: X @ing_ddo_11
    </footer>
  </main>

<!-- 하단 메뉴: 메인 → 리스트 → 검색 → 카테고리 -->
<nav class="bottom-menu" aria-label="하단 메뉴">
  <div class="menu-inner">

    <!-- 메인 -->
    <button
      class="menu-button"
      type="button"
      data-page="home"
      aria-controls="home"
      aria-current="page"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10 12 3l9 7"></path>
        <path d="M5 9v12h5v-7h4v7h5V9"></path>
      </svg>
      <span>메인</span>
    </button>

    <!-- 리스트 -->
    <button
      class="menu-button"
      type="button"
      data-page="list"
      aria-controls="list"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="3" width="16" height="18" rx="2"></rect>
        <path d="m8 12 3 3 5-6"></path>
      </svg>
      <span>리스트</span>
    </button>

    <!-- 검색 -->
    <button
      class="menu-button"
      type="button"
      data-page="search"
      aria-controls="search"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5"></circle>
        <path d="m16 16 5 5"></path>
      </svg>
      <span>검색</span>
    </button>

    <!-- 카테고리 -->
    <button
      class="menu-button"
      type="button"
      data-page="category"
      aria-controls="category"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
      <span>카테고리</span>
    </button>

  </div>
</nav>

  <script>
    const menuButtons = document.querySelectorAll(".menu-button");
    const pages = document.querySelectorAll("main > section");
    const searchInput = document.getElementById("search-input");

    menuButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const selectedPage = button.dataset.page;

        pages.forEach((page) => {
          page.hidden = page.id !== selectedPage;
        });

        menuButtons.forEach((item) => {
          if (item === button) {
            item.setAttribute("aria-current", "page");
          } else {
            item.removeAttribute("aria-current");
          }
        });

        window.scrollTo(0, 0);

        if (selectedPage === "search") {
          searchInput.focus({ preventScroll: true });
        }
      });
    });
  </script>
</body>
</html>
