/* 본문: G마켓 산스 Medium */
body {
  font-family: "GmarketSans", "맑은 고딕", sans-serif;
  font-weight: 500;
}

/* 입력창과 버튼에도 같은 폰트 적용 */
button,
input,
select,
textarea {
  font-family: inherit;
  font-weight: 500;
}

/* 하단 메뉴: 선택 상태에서도 Medium 유지 */
.menu-button,
.menu-button[aria-current="page"] {
  font-weight: 500;
}

/* 제목: G마켓 산스 Bold */
h1,
.title-text {
  font-family: "GmarketSans", "맑은 고딕", sans-serif;
  font-weight: 700;
}
/* 선택된 탭의 아이콘·글자 색상 */
.menu-button[aria-current="page"] {
  color: #3662ae;
}

/* 밑줄 공간을 미리 확보 */
.menu-button span {
  position: relative;
  padding-bottom: 7px;
}

/* 선택된 탭 이름 아래 밑줄 */
.menu-button[aria-current="page"] span::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  border-radius: 2px;
  background-color: #3662ae;
}
/* 검색 제목 아래 여백 */
#search h1 {
  margin-bottom: 10px;
}

/* 검색창 위 여백 */
#search .search-input {
  margin-top: 6px;
}
/* 아이콘과 제목을 나란히 배치 */
.page-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* 제목 옆 아이콘 */
.page-title svg {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* 동일한 너비의 3열 배치 */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 24px;
}

/* 사각형 테두리와 검은색 글씨 */
.category-item {
  width: 100%;
  min-height: 54px;
  padding: 12px 4px;
  border: 1px solid #000;
  border-radius: 0;
  background: #fff;
  color: #000;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

/* 전체 버튼은 3칸과 그 사이 간격까지 차지 */
.category-all {
  grid-column: 1 / -1;
  
}
/* 카테고리 버튼 모서리를 완전히 둥글게 */
.category-item {
  border-radius: 999px;
}

/* 포토카드 버튼 */
.photocard-button {
  display: block;
  width: 100%;
  min-height: 54px;
  margin-top: 32px;
  padding: 12px;
  border: 1px solid #000;
  border-radius: 999px;
  background: #fff;
  color: #000;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.category-item,
.photocard-button {
  min-height: 44px;
  padding: 8px 4px;
}
/* 내용이 짧아도 제작자 표기가 화면 아래에 오도록 설정 */
main {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* 업데이트 / 제보 버튼 */
.home-links {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 20px;
}

.home-link {

/* 얇은 구분선 */

/* 메인 제목 32px보다 조금 작은 제목 */

/* 굿즈 소식 5개 */
.goods-news {

}

.goods-card {

  align-items: center;

  border-radius: 8px;

  text-decoration: none;

/* 연번과 굿즈 이름 사이 세로선 */
.goods-number {

.goods-name {

}

/* 사진을 넣기 전 미리보기 자리 */
.goods-preview {

  align-items: center;
  justify-content: center;
  width: 80px;
  height: 80px;
  border-radius: 4px;

/* 실제 미리보기 사진 */
img.goods-preview {

}

/* 링크 연결 후 마우스 표시 */
.home-link[href],
.goods-card[href] {

}

.home-link[href]:focus-visible,
.goods-card[href]:focus-visible {

/* 공통 제작자 표기 */

        </svg>

      </button>

  <script>
    const menuButtons = document.querySelectorAll(".menu-button");
    const pages = document.querySelectorAll("main > section");

    menuButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const selectedPage = button.dataset.page;

        pages.forEach((page) => {
          page.hidden = page.id !== selectedPage;
        });

        menuButtons.forEach((item) => {
          item.removeAttribute("aria-current");
        });

        button.setAttribute("aria-current", "page");
        window.scrollTo(0, 0);

        if (selectedPage === "search") {
          document.getElementById("search-input").focus();
        }
      });
    });
  </script>
