<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSGOODSLIST</title>

  <style>
    @font-face {
      font-family: "GmarketSans";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff")
        format("woff");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "GmarketSans";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff")
       format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
 }
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #333;
      background: #fafafa;
      font-family: Arial, "맑은 고딕", sans-serif;
    }

    /* 하단 메뉴에 내용이 가리지 않도록 여백 확보 */
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 24px;
      padding-bottom: calc(110px + env(safe-area-inset-bottom));
    }

    h1 {
      font-size: 26px;
    }

    .description {
      color: #888;
      line-height: 1.6;
    }

    [hidden] {
      display: none !important;
    }

    /* 검색 입력창 */
    .search-input {
      width: 100%;
      margin-top: 16px;
      padding: 15px 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      font: inherit;
    }

    /* 하단 고정 메뉴 */
    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 100;
      width: 100%;
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid #eee;
      background: #fff;
    }

    .menu-inner {
      display: flex;
      max-width: 600px;
      margin: 0 auto;
    }

    .menu-button {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 76px;
      padding: 12px 0;
      border: 0;
      background: transparent;
      color: #999;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .menu-button svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 선택된 메뉴 색상 */
    .menu-button[aria-current="page"] {
      color: #333;
      font-weight: bold;
    }

    .menu-button:focus-visible {
      outline: 2px solid #777;
      outline-offset: -5px;
      border-radius: 10px;
    }
    .site-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 24px;
    }

    .site-logo {
      display: block;
      width: 24px;
      max-width: 30%;
      height: auto;
     }

.title-text {
  font-size: 24px;
  font-weight: 700;
}
/* 본문: G마켓 산스 Medium */
body {
  font-family: "GmarketSans", "맑은 고딕", sans-serif;
  font-weight: 500;
}

/* 입력창과 버튼에도 같은 폰트 적용 */
button,
input,
select,
textarea {
  font-family: inherit;
  font-weight: 500;
}

/* 하단 메뉴: 선택 상태에서도 Medium 유지 */
.menu-button,
.menu-button[aria-current="page"] {
  font-weight: 500;
}

/* 제목: G마켓 산스 Bold */
h1,
.title-text {
  font-family: "GmarketSans", "맑은 고딕", sans-serif;
  font-weight: 700;
}
/* 선택된 탭의 아이콘·글자 색상 */
.menu-button[aria-current="page"] {
  color: #3662ae;
}

/* 밑줄 공간을 미리 확보 */
.menu-button span {
  position: relative;
  padding-bottom: 7px;
}

/* 선택된 탭 이름 아래 밑줄 */
.menu-button[aria-current="page"] span::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  border-radius: 2px;
  background-color: #3662ae;
}
/* 검색 제목 아래 여백 */
#search h1 {
  margin-bottom: 10px;
}

/* 검색창 위 여백 */
#search .search-input {
  margin-top: 6px;
}
/* 아이콘과 제목을 나란히 배치 */
.page-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* 제목 옆 아이콘 */
.page-title svg {
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* 동일한 너비의 3열 배치 */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 24px;
}

/* 사각형 테두리와 검은색 글씨 */
.category-item {
  width: 100%;
  min-height: 54px;
  padding: 12px 4px;
  border: 1px solid #000;
  border-radius: 0;
  background: #fff;
  color: #000;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

/* 전체 버튼은 3칸과 그 사이 간격까지 차지 */
.category-all {
  grid-column: 1 / -1;
  
}
/* 카테고리 버튼 모서리를 완전히 둥글게 */
.category-item {
  border-radius: 999px;
}

/* 포토카드 버튼 */
.photocard-button {
  display: block;
  width: 100%;
  min-height: 54px;
  margin-top: 32px;
  padding: 12px;
  border: 1px solid #000;
  border-radius: 999px;
  background: #fff;
  color: #000;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.category-item,
.photocard-button {
  min-height: 44px;
  padding: 8px 4px;
}
  </style>
</head>

<body>
  <main>
    <!-- 검색 화면 -->
    <section id="search" hidden>
      <h1 class="page-title">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="10.5" cy="10.5" r="6.5"></circle>
    <path d="m16 16 5 5"></path>
  </svg>
  <span>검색</span>
</h1>
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="찾고싶은 사진의 키워드를 입력하세요"
      >
      <p class="description">
        사진을 등록한 뒤 검색 기능을 연결할 예정이에요.
      </p>
    </section>

    <!-- 메인 화면 -->
    <section id="home">
    <h1 class="site-title">
      <img src="./logo.png" alt="FS LIST" class="site-logo">
      <span class="title-text">굿즈 리스트</span>
    </h1>
    </section>

    <!-- 카테고리 화면 -->
    <section id="category" hidden>
      <h1 class="page-title">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 6h16M4 12h16M4 18h16"></path>
  </svg>
  <span>카테고리</span>
</h1>
<div class="category-grid">
  <button type="button" class="category-item category-all">전체</button>
  <button type="button" class="category-item">앨범</button>
  <button type="button" class="category-item">MD</button>
  <button type="button" class="category-item">시즌그리팅</button>
  <button type="button" class="category-item">팬키트</button>
  <button type="button" class="category-item">기타</button>
  <button type="button" class="category-item">개인</button>
</div>
<button type="button" class="photocard-button">
  포토카드만 보기
</button>
    </section>
  </main>

  <!-- 하단 메뉴 -->
  <nav class="bottom-menu" aria-label="하단 메뉴">
    <div class="menu-inner">

      <button
        class="menu-button"
        type="button"
        data-page="search"
        aria-controls="search"
      >
        <!-- 돋보기 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="m16 16 5 5"></path>
        </svg>
        <span>검색</span>
      </button>

      <button
        class="menu-button"
        type="button"
        data-page="home"
        aria-controls="home"
        aria-current="page"
      >
        <!-- 집 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10 12 3l9 7"></path>
          <path d="M5 9v12h5v-7h4v7h5V9"></path>
        </svg>
        <span>메인</span>
      </button>

      <button
        class="menu-button"
        type="button"
        data-page="category"
        aria-controls="category"
      >
        <!-- 가로줄 3개 -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>카테고리</span>
      </button>

    </div>
  </nav>

  <script>
    const menuButtons = document.querySelectorAll(".menu-button");
    const pages = document.querySelectorAll("main > section");

    menuButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const selectedPage = button.dataset.page;

        pages.forEach((page) => {
          page.hidden = page.id !== selectedPage;
        });

        menuButtons.forEach((item) => {
          item.removeAttribute("aria-current");
        });

        button.setAttribute("aria-current", "page");
        window.scrollTo(0, 0);

        if (selectedPage === "search") {
          document.getElementById("search-input").focus();
        }
      });
    });
  </script>
</body>
</html>
