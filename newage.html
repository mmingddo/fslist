  <style>
    /* ====================
       화면에는 숨기는 활동 제목
    ==================== */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .back-link {
      align-self: flex-start;
    }

    /* ====================
       활동 이미지·정보 배치
    ==================== */
    .album-header {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 20px;
    }

    .album-info {
      min-width: 0;
    }

    .album-image {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--accent-color);
      border-radius: 12px;
      background: #f2f2f2;
      object-fit: cover;
      object-position: center;
    }

    /* ====================
       활동 정보 표
    ==================== */
    .info-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      border-radius: 12px;
      table-layout: fixed;
      font-size: 14px;
      line-height: 1.6;
    }

    .info-table th,
    .info-table td {
      padding: 14px 10px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .info-table th {
      width: 36%;
      border: 0;
      background: var(--accent-color);
      color: #fff;
      font-weight: 500;
    }

    .info-table td {
      border: 1px solid var(--accent-color);
      background: #fff;
      color: #000;
    }

    /* 왼쪽 항목 사이 흰색 구분선 */
    .info-table tr + tr th {
      border-top: 1px solid #fff;
    }

    /* 오른쪽 테두리 겹침 방지 */
    .info-table tr + tr td {
      border-top: 0;
    }

    .info-table tr:first-child th {
      border-top-left-radius: 12px;
    }

    .info-table tr:first-child td {
      border-top-right-radius: 12px;
    }

    .info-table tr:last-child th {
      border-bottom-left-radius: 12px;
    }

    .info-table tr:last-child td {
      border-bottom-right-radius: 12px;
    }

    /* ====================
       활동 페이지의 상품 목록
    ==================== */
    .goods-section {
      margin-top: 32px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
    }

    .goods-list {
      display: grid;
      gap: 12px;
    }

    .goods-content {
      line-height: 1.7;
    }

    .product-image {
      height: auto;
    }

    .product-description {
      overflow-wrap: anywhere;
    }

    .product-table {
      line-height: 1.6;
    }

    /* ====================
       모바일 활동 정보
    ==================== */
    @media (max-width: 480px) {
      .album-header {
        gap: 12px;
      }

      .info-table {
        font-size: 11px;
      }

      .info-table th,
      .info-table td {
        padding: 10px 4px;
      }

      .info-table th {
        width: 40%;
      }
    }
  </style>

  <script>
    (() => {
      /*
        검색 결과·마이페이지 등에서 전달한
        상품 번호 또는 상품 ID로 해당 상품을 펼칩니다.
      */
      const cards = [
        ...document.querySelectorAll(
          ".goods-accordion[data-category]"
        )
      ];

      const params = new URLSearchParams(location.search);
      const productNumber = Number(params.get("product"));

      let productId = "";

      try {
        productId = decodeURIComponent(location.hash.slice(1));
      } catch {
        // 해시가 잘못된 형식이면 상품 번호로 확인합니다.
      }

      /* 고유한 상품 ID로 찾기 */
      let target = cards.find((card) => {
        return card.id === productId;
      });

      /* 상품 ID로 찾지 못하면 상품 번호로 찾기 */
      if (
        !target &&
        Number.isInteger(productNumber) &&
        productNumber >= 1
      ) {
        target = cards[productNumber - 1];
      }

      if (!target) return;

      target.open = true;

      function scrollToProduct() {
        requestAnimationFrame(() => {
          target.scrollIntoView({
            block: "start"
          });
        });
      }

      if (document.readyState === "complete") {
        scrollToProduct();
      } else {
        window.addEventListener("load", scrollToProduct, {
          once: true
        });
      }
    })();
  </script>
