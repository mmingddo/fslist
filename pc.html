<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#3662ae">

  <title>포토카드만 모아보기 | 굿즈리스트</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="stylesheet" href="./category.css">

  <style>
    [hidden] {
      display: none !important;
    }

    /* 개인·유닛·단체 선택 버튼 */
    .pc-filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 16px 0;
    }

    .pc-filter {
      min-width: 0;
      min-height: 40px;
      padding: 8px 4px;
      border: 1px solid #999;
      border-radius: 999px;
      background: #fff;
      color: #333;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .pc-filter[aria-pressed="true"] {
      border-color: var(--accent-color);
      font-weight: 700;
    }

    .pc-filter[data-type="personal"][aria-pressed="true"] {
      background: #dfb2fa;
    }

    .pc-filter[data-type="unit"][aria-pressed="true"] {
      background: #ffd18b;
    }

    .pc-filter[data-type="group"][aria-pressed="true"] {
      background: #a8e8e8;
    }

    .pc-filter:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 3px;
    }
  </style>

  <script src="./pc.js" defer></script>
</head>

<body>
  <main>
    <!-- 로고·사이트명 시작 -->
    <a class="site-brand" href="./index.html#home">
      <img
        class="site-logo"
        src="https://drive.google.com/thumbnail?id=1-pbgQfZiJJAgWXwyRTvR9-FxeN2V2PbB&amp;sz=w1600"
        alt="FS LIST"
      >
      <span class="site-brand-text">굿즈리스트</span>
    </a>
    <!-- 로고·사이트명 끝 -->

    <section aria-labelledby="pc-title">
      <h1 id="pc-title" class="category-title">
        카테고리 → 포토카드만 모아보기
      </h1>

      <!-- 유형 선택 버튼 시작 -->
      <div class="pc-filters" role="group" aria-label="포토카드 유형 필터">
        <button
          class="pc-filter"
          type="button"
          data-type="personal"
          aria-pressed="false"
          aria-controls="pc-products"
        >
          개인
        </button>

        <button
          class="pc-filter"
          type="button"
          data-type="unit"
          aria-pressed="false"
          aria-controls="pc-products"
        >
          유닛
        </button>

        <button
          class="pc-filter"
          type="button"
          data-type="group"
          aria-pressed="false"
          aria-controls="pc-products"
        >
          단체
        </button>
      </div>
      <!-- 유형 선택 버튼 끝 -->

      <a class="back-link" href="./index.html#category">
        ← 카테고리로 이동하기
      </a>

      <p id="pc-message" class="category-description" role="status">
        포토카드를 불러오고 있어요.
      </p>

      <div id="pc-products" class="category-products"></div>
    </section>

    <!-- 제작자 표기 시작 -->
    <footer class="site-credit">
      제작<br>

      <a
        href="https://x.com/ing_ddo_11"
        target="_blank"
        rel="noopener noreferrer"
      >@ing_ddo_11</a>

      <hr class="credit-divider">

      도움<br>

      <a
        href="https://x.com/hhhh_7989"
        target="_blank"
        rel="noopener noreferrer"
      >@hhhh_7989</a><br>

      <a
        href="https://x.com/UrimThummim0505"
        target="_blank"
        rel="noopener noreferrer"
      >@UrimThummim0505</a><br>

      <a
        href="https://x.com/forkkeu"
        target="_blank"
        rel="noopener noreferrer"
      >@forkkeu</a>
    </footer>
    <!-- 제작자 표기 끝 -->
  </main>
</body>
</html>
